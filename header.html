<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RemoteX Title Header</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }

    body {
      background-color: transparent;
      color: #37352f;
      padding: 4px 8px;
    }

    .header-container {
      max-width: 1000px;
      margin: 0 auto;
      text-align: center;
      padding: 20px 16px 16px 16px;
      background: linear-gradient(180deg, rgba(240, 249, 248, 0.5) 0%, rgba(255, 255, 255, 0) 100%);
      border-radius: 16px;
    }

    .title {
      font-size: 1.85rem;
      font-weight: 800;
      color: #0b1d3a; /* Deep Navy Brand RemoteX */
      letter-spacing: -0.5px;
      line-height: 1.25;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 1.05rem;
      font-style: italic;
      font-weight: 600;
      color: #3dbdb0; /* Teal Accent Brand RemoteX */
      letter-spacing: 0.2px;
    }

    @media (max-width: 600px) {
      .title {
        font-size: 1.45rem;
      }
      .subtitle {
        font-size: 0.92rem;
      }
    }
  </style>
</head>
<body>

  <div class="header-container">
    <h1 class="title">Modul Bootcamp RemoteX: Beyond Cubicle</h1>
    <p class="subtitle">Unleash Your X. Unlock Global Opportunities.</p>
  </div>

</body>
</html>
